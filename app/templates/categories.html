{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">MAKE IT YOURS</div><h1>Item categories</h1><p class="muted">Organize your purchases in a way that makes sense to you.</p></div></div><section class="panel settings-panel"><h2>Your workspace categories</h2><p class="muted">Renaming a category updates its label in historical reports.</p>{% for c in categories %}<form class="category-form" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="category_id" value="{{ c.id }}"><input class="form-control" name="name" value="{{ c.name }}" required maxlength="100" aria-label="Category name"><button class="btn btn-outline-secondary">Rename</button></form>{% endfor %}<hr><form class="category-form" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input class="form-control" name="name" placeholder="New category name" required maxlength="100" aria-label="New category name"><button class="btn btn-primary">Add category</button></form></section>{% endblock %}
